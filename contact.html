  <a href="https://youtube.com/@visualsfromchris" target="_blank" aria-label="YouTube">

</div>
</div>

        <button class="nav-toggle" aria-label="Open menu" onclick="toggleMenu()">☰</button>
      </nav>
    </div>

    <!-- MENU OVERLAY MOBILE -->
    <div id="nav-mobile" class="nav-mobile">
      <button class="nav-close" aria-label="Close menu" onclick="toggleMenu()">✕</button>

      <div class="nav-mobile-main">
        <a href="index.html" onclick="toggleMenu()">Home</a>
        <a href="work.html" onclick="toggleMenu()">Work</a>
        <a href="contact.html" onclick="toggleMenu()">Contact</a>
      </div>

      <div class="nav-mobile-footer">
        <a href="https://instagram.com/visualsfromchris" target="_blank" rel="noopener">Instagram</a>
        <a href="https://youtube.com/@visualsfromchris" target="_blank" rel="noopener">YouTube</a>
        <a href="mailto:chris.rec709@gmail.com">Email</a>
      </div>
    </div>
  </header>
<main>
  <section class="contact-split">
    <!-- Colonne gauche : comme intro -->
    <div class="contact-left">
      <div class="contact-left-inner">
        <h1 class="contact-title">CONTACT<br>ME</h1>

        <p class="contact-text">
          For collaborations, content creation, or travel projects,
          feel free to reach out.
        </p>

        <p class="contact-text">
          Send a message and I’ll get back to you soon.
        </p>
      </div>
    </div>

    <!-- Colonne droite : formulaire style newsletter -->
    <div class="contact-right">
      <div class="contact-form-wrap">
        <h2 class="contact-form-title">LET’S CONNECT.</h2>
        <p class="contact-form-subtitle">
          
        </p>

        <form class="contact-form" action="https://formspree.io/f/mdkqywlp" method="post">
          <input type="text" name="name" placeholder="Full Name" autocomplete="name" required />
          <input type="email" name="email" placeholder="Email Address" autocomplete="email" required />
          <input type="text" name="subject" placeholder="Subject" required />
          <textarea name="message" placeholder="Your Message" rows="6" required></textarea>

          <button type="submit">SEND MESSAGE</button>
        </form>

        <div class="contact-links">
          <a href="https://instagram.com" target="_blank" rel="noopener">Instagram</a>
          <span class="sep">|</span>
          <a href="mailto:chris.rec709@gmzil.com">Email</a>
        </div>
      </div>
    </div>
  </section>
</main>

  <footer class="site-footer-min">
  <span>© <span id="year"></span> Chris — Storytelling Visuals</span>
</footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
    function toggleMenu() {
      const nav = document.getElementById("nav-mobile");
      const isHidden = nav.style.display === "" || nav.style.display === "none";
      nav.style.display = isHidden ? "flex" : "none";
    }
  </script>
</body>
</html>
